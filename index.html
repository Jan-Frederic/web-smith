<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>web-smith</title>
  <style>
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #0b0d16;
      color: #eaf0ff;
      display: grid;
      place-items: center;
      height: 100vh;
      transition: color 0.3s ease;
    }
    .wrap {
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.02em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="random-text">Hello World</h1>
  </div>
  <script>
    const messages = [
      "Hello World",
      "Jo Baby Jo Baby Jo",
      "Boing!"
    ];
    
    function updateRandomText() {
      const randomIndex = Math.floor(Math.random() * messages.length);
      document.getElementById("random-text").textContent = messages[randomIndex];
    }
    
    // Initial update
    updateRandomText();
    
    // Update on page load
    window.addEventListener('load', updateRandomText);
  </script>
</body>
</html>
