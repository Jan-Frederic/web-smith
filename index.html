<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chuck Norris Witze</title>
    <style>
      :root {
        --card: rgba(0, 0, 0, 0.32);
        --text: rgba(255, 255, 255, 0.94);
        --muted: rgba(255, 255, 255, 0.72);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 2.5rem 1.25rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        overflow-x: hidden;
        background: #070812;
      }

      /* Animated rainbow background */
      body::before {
        content: "";
        position: fixed;
        inset: -40vmax;
        z-index: -2;
        background: conic-gradient(
          from 180deg,
          #ff004c,
          #ff7a00,
          #ffe600,
          #2bff88,
          #00d4ff,
          #5b5bff,
          #b700ff,
          #ff004c
        );
        animation: spin 16s linear infinite;
        filter: blur(60px) saturate(170%);
        opacity: 0.95;
      }

      body::after {
        content: "";
        position: fixed;
        inset: -30vmax;
        z-index: -1;
        background: radial-gradient(closest-side, rgba(255,255,255,0.12), transparent 70%);
        animation: drift 9s ease-in-out infinite alternate;
        filter: blur(50px);
        opacity: 0.55;
        pointer-events: none;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift {
        0%   { transform: translate(-2%, -1%) scale(1.02); }
        100% { transform: translate(2%, 1%)  scale(1.06); }
      }

      .wrap {
        width: min(920px, 100%);
        margin: 0 auto;
        display: grid;
        gap: 1.25rem;
      }

      .card {
        background: var(--card);
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 18px;
        padding: 1.75rem;
        box-shadow: 0 22px 80px rgba(0,0,0,0.55);
        backdrop-filter: blur(14px);
      }

      h1 {
        margin: 0 0 0.25rem 0;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: -0.03em;
      }

      p { margin: 0.4rem 0 0; color: var(--muted); line-height: 1.55; }

      .joke {
        margin-top: 1.25rem;
        padding: 1.25rem;
        border-radius: 16px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.16);
        font-size: 1.15rem;
        line-height: 1.55;
      }

      .row {
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 1rem;
      }

      button {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.18);
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.92);
        padding: 0.65rem 0.9rem;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 650;
      }
      button:hover { border-color: rgba(255,255,255,0.35); }
      button:active { transform: translateY(1px); }

      code {
        background: rgba(0,0,0,0.25);
        padding: 0.15rem 0.4rem;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.12);
        color: rgba(255,255,255,0.92);
      }

      a {
        color: rgba(255,255,255,0.92);
        text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.35);
      }
      a:hover { border-bottom-color: rgba(255,255,255,0.7); }

      .small { font-size: 0.95rem; color: rgba(255,255,255,0.62); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="card">
        <h1>Chuck Norris Witze</h1>
        <p>
          Frisch gezapft von <code>https://api.chucknorris.io/jokes/random</code>.
          Klick auf „Neuer Witz“ für den nächsten.
        </p>

        <div class="joke" id="joke">Lade Witz…</div>

        <div class="row">
          <button id="btn" type="button">Neuer Witz</button>
          <span class="small">Tipp: Seite ist scrollable. 😉</span>
        </div>
      </header>

      <section class="card">
        <p class="small">
          Quelle: <a href="https://api.chucknorris.io/" target="_blank" rel="noreferrer">api.chucknorris.io</a>
        </p>
      </section>
    </div>

    <script>
      const jokeEl = document.getElementById('joke');
      const btn = document.getElementById('btn');

      async function loadJoke() {
        btn.disabled = true;
        btn.textContent = 'Lade…';
        try {
          const res = await fetch('https://api.chucknorris.io/jokes/random', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          jokeEl.textContent = data.value || 'Kein Witz gefunden.';
        } catch (e) {
          jokeEl.textContent = 'Konnte keinen Witz laden: ' + e.message;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Neuer Witz';
        }
      }

      btn.addEventListener('click', loadJoke);
      loadJoke();
    </script>
  </body>
</html>
