<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>web-smith</title>
  <style>
    :root{
      --bg:#070913;
      --card:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.14);
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.7);
      --a:#7c5cff;
      --b:#00d4ff;
      --c:#ff3d81;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(124,92,255,.35), transparent 55%),
        radial-gradient(900px 500px at 90% 20%, rgba(0,212,255,.25), transparent 60%),
        radial-gradient(900px 600px at 50% 100%, rgba(255,61,129,.18), transparent 60%),
        var(--bg);
      color:var(--text);
      display:grid;
      place-items:center;
      padding:24px;
    }
    .wrap{
      width:min(820px, 100%);
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--card);
      box-shadow:0 28px 90px rgba(0,0,0,.55);
      padding:28px;
      backdrop-filter: blur(10px);
    }
    h1{
      margin:0 0 8px;
      font-size:clamp(1.8rem, 3.8vw, 3rem);
      letter-spacing:-.03em;
      line-height:1.05;
      background: linear-gradient(90deg, var(--a), var(--b), var(--c));
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    p{margin:0 0 18px;color:var(--muted)}
    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:16px;
      margin-top:14px;
    }
    .card{
      border:1px solid var(--line);
      border-radius:16px;
      padding:18px;
      background: rgba(0,0,0,.18);
    }
    .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.05);
      font-weight:600;
    }
    .big{
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 900;
      letter-spacing:-.03em;
      margin: 8px 0 0;
      text-align:center;
    }
    .vs{
      display:grid;
      grid-template-columns: 1fr auto 1fr;
      align-items:center;
      gap:12px;
      margin-top:12px;
    }
    .choice{
      text-align:center;
      padding:16px;
      border-radius:14px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      min-height:78px;
      display:grid;
      place-items:center;
      font-size: clamp(1.1rem, 2.4vw, 1.6rem);
      font-weight:800;
    }
    .vs span{
      opacity:.7;
      font-weight:800;
      letter-spacing:.12em;
    }
    .result{
      text-align:center;
      margin-top:12px;
      font-weight:800;
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
    }
    .hint{
      font-size:.95rem;
      opacity:.75;
      margin-top:10px;
      text-align:center;
    }
    button{
      cursor:pointer;
      border-radius:12px;
      padding:12px 14px;
      border:1px solid var(--line);
      background: linear-gradient(90deg, rgba(124,92,255,.25), rgba(0,212,255,.18));
      color:var(--text);
      font-weight:800;
    }
    button:hover{filter:brightness(1.1)}
    .pick{
      min-width: 140px;
      background: rgba(255,255,255,.06);
    }
    .pick.active{
      outline: 2px solid rgba(0,212,255,.55);
      box-shadow: 0 0 0 6px rgba(0,212,255,.12);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Schere · Stein · Papier</h1>
    <p>Bei jedem Reload wird automatisch gespielt — mit Countdown. 😎</p>

    <section class="grid">
      <div class="card">
        <div class="row">
          <div class="pill">⏳ Countdown: <span id="count">5</span></div>
          <div class="pill">🔄 Runde: <span id="round">1</span></div>
          <button id="again" type="button" title="Spiele nochmal (ohne Reload)">Nochmal!</button>
        </div>

        <div class="big" id="status">Wähle deinen Zug…</div>

        <div class="row" style="justify-content:center; margin: 10px 0 4px;">
          <button class="pick" type="button" data-pick="schere">✂️ Schere</button>
          <button class="pick" type="button" data-pick="stein">🪨 Stein</button>
          <button class="pick" type="button" data-pick="papier">📄 Papier</button>
        </div>

        <div class="vs" aria-label="Spielauswahl">
          <div class="choice"><div><div style="opacity:.7;font-weight:700;font-size:.95rem">DU</div><div id="you">—</div></div></div>
          <span>VS</span>
          <div class="choice"><div><div style="opacity:.7;font-weight:700;font-size:.95rem">ICH</div><div id="ai">—</div></div></div>
        </div>

        <div class="result" id="result">Wähle in 5 Sekunden Schere/Stein/Papier – sonst wird zufällig gewählt.</div>
        <div class="hint">Tipp: Reload (F5) = neue Runde. „Nochmal!“ startet neu.</div>
      </div>
    </section>
  </main>

  <script>
    const choices = [
      { key: 'schere', label: '✂️ Schere' },
      { key: 'stein',  label: '🪨 Stein'  },
      { key: 'papier', label: '📄 Papier' }
    ];

    const elCount  = document.getElementById('count');
    const elRound  = document.getElementById('round');
    const elStatus = document.getElementById('status');
    const elYou    = document.getElementById('you');
    const elAi     = document.getElementById('ai');
    const elResult = document.getElementById('result');
    const btnAgain = document.getElementById('again');
    const pickButtons = Array.from(document.querySelectorAll('.pick'));

    // Keep a simple per-session round counter in sessionStorage.
    const roundKey = 'rps_round';
    const currentRound = Number(sessionStorage.getItem(roundKey) || '0') + 1;
    sessionStorage.setItem(roundKey, String(currentRound));
    elRound.textContent = String(currentRound);

    function pickRandom() {
      return choices[Math.floor(Math.random() * choices.length)];
    }

    function decide(a, b) {
      // returns 0 draw, 1 a wins, -1 b wins
      if (a === b) return 0;
      if (
        (a === 'schere' && b === 'papier') ||
        (a === 'papier' && b === 'stein')  ||
        (a === 'stein'  && b === 'schere')
      ) return 1;
      return -1;
    }

    function renderResult(you, ai) {
      elYou.textContent = you.label;
      elAi.textContent  = ai.label;

      const r = decide(you.key, ai.key);
      if (r === 0) {
        elStatus.textContent = 'Unentschieden!';
        elResult.textContent = 'Nochmal. Reload. Oder klick „Nochmal!“';
      } else if (r === 1) {
        elStatus.textContent = 'Du gewinnst!';
        elResult.textContent = 'Respekt. Aber ich komm wieder.';
      } else {
        elStatus.textContent = 'Ich gewinne!';
        elResult.textContent = 'Tja… erwischt. 😎';
      }
    }

    let timer = null;
    let locked = false;
    let selected = null; // {key,label}

    function setActivePick(key) {
      pickButtons.forEach(btn => {
        const isActive = btn.dataset.pick === key;
        btn.classList.toggle('active', isActive);
      });
    }

    pickButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (locked) return;
        const k = btn.dataset.pick;
        selected = choices.find(c => c.key === k) || null;
        setActivePick(k);
        elStatus.textContent = 'Gute Wahl.';
      });
    });

    function playWithCountdown(seconds = 5) {
      if (timer) clearInterval(timer);
      locked = false;
      selected = null;
      setActivePick(null);

      let t = seconds;
      elCount.textContent = String(t);
      elStatus.textContent = 'Wähle deinen Zug…';
      elYou.textContent = '—';
      elAi.textContent = '—';
      elResult.textContent = 'Wähle in 5 Sekunden – sonst wird zufällig gewählt.';

      timer = setInterval(() => {
        t -= 1;
        elCount.textContent = String(Math.max(t, 0));

        if (t === 0) {
          locked = true;
          clearInterval(timer);
          timer = null;

          const you = selected || pickRandom();
          const ai  = pickRandom();

          elStatus.textContent = selected ? 'Zeit!' : 'Zeit! (zufällig gewählt)';
          setTimeout(() => renderResult(you, ai), 250);
        }
      }, 1000);
    }

    btnAgain.addEventListener('click', () => playWithCountdown(5));

    // Auto-play on every load.
    playWithCountdown(5);
  </script>
</body>
</html>
